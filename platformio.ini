; ClapTuya — PlatformIO project
; อัปโหลด: กดลูกศร → ที่แถบล่างของ VS Code (PlatformIO: Upload)
; ดู log: กดรูปปลั๊ก (PlatformIO: Serial Monitor)

[env:esp32dev]
platform = espressif32@6.9.0      ; Arduino core 2.0.x
board = esp32dev                  ; ESP32-WROOM-32E ใช้ตัวนี้ได้
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
; บอร์ดมีวงจรรีเซ็ตอัตโนมัติ (Q3, Q4) ต้องปิด DTR/RTS ตอนเปิด Serial Monitor
; ไม่งั้นบอร์ดจะค้างอยู่ในสถานะรีเซ็ตหรือโหมดโหลดโค้ด แล้วไม่ขึ้นข้อความอะไรเลย
monitor_rts = 0
monitor_dtr = 0
; ถ้ามีหลายพอร์ตแล้วเลือกผิด ให้เอา ; ออกแล้วแก้เลข COM ให้ตรงกับ CH340
; upload_port = COM5
; monitor_port = COM5
